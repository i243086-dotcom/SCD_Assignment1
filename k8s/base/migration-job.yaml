apiVersion: batch/v1
kind: Job
metadata:
  name: civicpulse-migrate
  namespace: civicpulse
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: { app: civicpulse-migrate }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/OWNER/civicpulse-backend:sha-placeholder
          command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: DATABASE_URL } }
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: civicpulse-secrets, key: GROQ_API_KEY } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
