name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -e './backend[dev]'
      - run: cd backend && ruff check app && mypy app && pytest --cov=app --cov-fail-under=65
      - run: python scripts/check_openapi_contract.py
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend test

  build-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        name: Normalize GHCR owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-backend:${{ github.sha }}
      - id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-frontend:${{ github.sha }}
      - name: Backend SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-backend@${{ steps.backend.outputs.digest }}
          artifact-name: backend-sbom.spdx.json
          format: spdx-json
      - name: Frontend SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ghcr.io/${{ steps.vars.outputs.owner }}/civicpulse-frontend@${{ steps.frontend.outputs.digest }}
          artifact-name: frontend-sbom.spdx.json
          format: spdx-json
      - name: Print immutable digests
        run: |
          echo "backend=${{ steps.backend.outputs.digest }}"
          echo "frontend=${{ steps.frontend.outputs.digest }}"

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      packages: read
    env:
      OWNER: ${{ needs.build-push.outputs.owner }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1.12.0
        with:
          install_only: true
      - uses: azure/setup-kubectl@v4
        with: { version: 'v1.32.2' }
      - name: Install Kustomize
        shell: bash
        run: |
          KUSTOMIZE_VERSION=v5.6.0
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin
          kustomize version
      - name: Create ephemeral kind cluster
        run: kind create cluster --name civicpulse --config scripts/kind-config.yaml --image kindest/node:v1.32.2
      - name: Pull and load SHA images
        run: |
          docker pull ghcr.io/$OWNER/civicpulse-backend:${{ github.sha }}
          docker pull ghcr.io/$OWNER/civicpulse-frontend:${{ github.sha }}
          kind load docker-image --name civicpulse ghcr.io/$OWNER/civicpulse-backend:${{ github.sha }} ghcr.io/$OWNER/civicpulse-frontend:${{ github.sha }}
      - name: Install ingress, metrics-server and VPA
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.0/deploy/static/provider/kind/deploy.yaml
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]' || true
          git clone --quiet --depth 1 --branch vertical-pod-autoscaler-1.2.0 https://github.com/kubernetes/autoscaler.git /tmp/autoscaler
          /tmp/autoscaler/vertical-pod-autoscaler/hack/vpa-up.sh
      - name: Render production manifests with SHA image
        shell: bash
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/OWNER/civicpulse-backend=ghcr.io/$OWNER/civicpulse-backend:${{ github.sha }} \
            ghcr.io/OWNER/civicpulse-frontend=ghcr.io/$OWNER/civicpulse-frontend:${{ github.sha }}
          cd ../../..
          export DATABASE_URL="postgresql+psycopg://civicpulse:${POSTGRES_PASSWORD}@postgres:5432/civicpulse"
          kustomize build k8s/overlays/prod | envsubst > /tmp/civicpulse.yaml
      - name: Deploy and wait
        run: |
          kubectl apply -f /tmp/civicpulse.yaml
          kubectl wait -n civicpulse --for=condition=complete job/civicpulse-migrate --timeout=180s
          kubectl rollout status -n civicpulse deployment/backend --timeout=180s
          kubectl rollout status -n civicpulse deployment/frontend --timeout=180s
          kubectl rollout status -n civicpulse deployment/redis --timeout=180s
      - name: Smoke test through Ingress
        run: |
          kubectl wait -n ingress-nginx --for=condition=Ready pod -l app.kubernetes.io/component=controller --timeout=180s
          for i in $(seq 1 30); do
            if curl -fsS -H 'Host: civicpulse.local' http://127.0.0.1/api/complaints?page=1 >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: HPA status
        if: always()
        run: kubectl get hpa -n civicpulse
