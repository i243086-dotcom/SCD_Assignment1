name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install backend tooling
        run: pip install -e './backend[dev]'
      - name: Backend lint
        run: cd backend && ruff check app
      - name: Backend type check
        run: cd backend && mypy app
      - name: OpenAPI contract check
        run: python scripts/check_openapi_contract.py
      - name: Install frontend
        # package-lock.json is intentionally not committed until npm can resolve it in a trusted environment.
        run: npm install --prefix frontend --no-audit --no-fund
      - name: Frontend lint
        run: npm --prefix frontend run lint
      - name: Frontend type check
        run: npm --prefix frontend run typecheck

  test-backend:
    runs-on: ubuntu-latest
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e './backend[dev]'
      - run: cd backend && pytest --cov=app --cov-fail-under=65

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --prefix frontend --no-audit --no-fund
      - run: npm --prefix frontend test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: civicpulse-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: civicpulse-frontend:ci

  scan:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build scan images
        run: |
          docker build -t civicpulse-backend:scan backend
          docker build -t civicpulse-frontend:scan frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: civicpulse-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: civicpulse-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with: { version: 'v1.32.2' }
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Render and validate
        run: kubectl kustomize k8s/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

  integration:
    runs-on: ubuntu-latest
    needs: [lint-and-type, test-backend, test-frontend]
    env:
      TRIAGE_PROVIDER: simulated
      POSTGRES_PASSWORD: ci_test_pw
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d --build postgres redis backend frontend
          trap 'docker compose down -v' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ready >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ready
          body=$(curl -fsS -X POST http://localhost:8080/api/complaints \
            -H 'Content-Type: application/json' \
            -d '{"text":"Burst water main flooding Street 12 since fajr.","location":"Street 12"}')
          echo "$body" > /tmp/complaint.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/complaint.json'))
          assert data['category']=='water', data
          open('/tmp/id','w').write(data['id'])
          PY
          id=$(cat /tmp/id)
          curl -fsS "http://localhost:8080/api/complaints/$id" >/tmp/fetched.json
          python - <<'PY'
          import json
          created = json.load(open('/tmp/complaint.json'))
          fetched = json.load(open('/tmp/fetched.json'))
          assert fetched['id'] == created['id'], fetched
          assert fetched['category'] == 'water', fetched
          assert fetched['status'] == 'open', fetched
          PY
          first=$(curl -fsS -D - -o /tmp/stats1 http://localhost:8080/api/stats | tr -d '\r' | awk 'tolower($1)=="x-cache:" {print $2}')
          second=$(curl -fsS -D - -o /tmp/stats2 http://localhost:8080/api/stats | tr -d '\r' | awk 'tolower($1)=="x-cache:" {print $2}')
          test "$first" = "MISS"
          test "$second" = "HIT"
          docker compose down -v
